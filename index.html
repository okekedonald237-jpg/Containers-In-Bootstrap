<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Containers In Bootstrap</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-9ndCyUaIbzAi2FUVXJi0CjmCapSmO7SnpJef0486qhLnuZ2cdeRhO02iuK6FUUVM" crossorigin="anonymous">
</head>
<body>
    <div class="container my-4">
        <div class="bg-danger border border-success p-4 text-center rounded">
            <h2>Welcome to Containers in Bootstrap</h2>
            <p>This is a simple example of using Bootstrap containers.</p>
        </div>
    </div>
    <div class="container-fluid my-4">
        <div class="bg-secondary border border-primary p-4 text-center rounded">
            <h2>Welcome to Containers in Bootstrap</h2>
            <p>This is a simple example of using Bootstrap containers.</p>
        </div>
    </div>
    <div class="container-sm my-4">
        <div class="bg-info border border-dark p-4 text-center rounded">
            <h2>Welcome to Containers in Bootstrap</h2>
            <p>This is a simple example of using Bootstrap containers.</p>
        </div>
    </div>
</body>
</html>
